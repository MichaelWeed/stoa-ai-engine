name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check stoa/ benchmarks/ tests/

      - name: Test
        run: pytest --cov=stoa --cov-report=term-missing -q

      - name: Benchmark (no API key required — uses simulation)
        run: python -c "from benchmarks.runner import BenchmarkRunner; BenchmarkRunner().run(runs_per_workflow=10)"
