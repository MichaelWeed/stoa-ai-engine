[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stoa"
version = "0.1.0"
description = "Deterministic, zero-trust execution framework for AI agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.40.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "docker>=7.1.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.3.0",
    "streamlit>=1.35.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
stoa = "stoa.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["stoa"]
include = ["stoa/_data/.env.example"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
